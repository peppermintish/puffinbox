[package]
name = "puffinbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "An original, self-hosted media server with a Jellyfin-compatible API surface"

[[bin]]
name = "puffinbox-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.4", features = ["macros", "ws"] }
base64 = "0.22.1"
bytes = "1.10.1"
cap-std = "3.4.4"
chrono = { version = "0.4.41", features = ["serde"] }
ctutils = "0.4.2"
futures-util = "0.3.31"
ipnet = "2.11.0"
libc = "0.2"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rand = "0.8.5"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "native-tls-vendored", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.7"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1.44.2", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.14", features = ["io"] }
tower-http = { version = "0.6.2", features = ["cors", "fs", "limit", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
# The upstream ASCII-only backend avoids bundling Unicode data under another license.
idna_adapter = "=1.0.0"
url = "2.5.4"
# Plugins are compiled Wasm; do not bundle the optional text compiler or its data tables.
wasmi = { version = "=1.1.0", default-features = false, features = ["std"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Exclude rustix's Linux vDSO parser, which carries a separate CC0 origin.
rustix = { version = "=1.1.5", default-features = false, features = ["use-libc"] }

[dev-dependencies]
futures-channel = { version = "0.3.34", features = ["sink"] }
hmac = "0.12.1"
http-body-util = "0.1.3"
mime_guess = { version = "=2.0.5", default-features = false }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
tower = { version = "0.5.2", features = ["util"] }

[patch.crates-io]
digest = { path = "vendor/digest" }
hashbrown = { path = "vendor/hashbrown" }
hashlink = { path = "vendor/hashlink" }
futures-channel = { path = "vendor/futures-channel" }
mime_guess = { path = "vendor/mime_guess" }
matchit = { path = "crates/route-matcher" }
unicode-ident = { path = "crates/ascii-ident" }

[workspace]
members = ["crates/route-matcher", "crates/ascii-ident"]
exclude = ["vendor/digest", "vendor/hashbrown", "vendor/hashlink", "vendor/futures-channel", "vendor/mime_guess"]
