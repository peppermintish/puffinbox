name: Experimental GNU runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-probe.yml'
      - 'experiments/linux-gnu-entry/**'
      - 'experiments/linux-gnu-runtime/**'
      - 'scripts/check_gnu_link_map.py'
      - 'scripts/check_gnu_source_map.py'
      - 'scripts/check_gnu_notices.py'
      - 'scripts/test_gnu_notices.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - 'vendor/**'
      - 'migrations/**'
  pull_request:
    paths:
      - '.github/workflows/runtime-probe.yml'
      - 'experiments/linux-gnu-entry/**'
      - 'experiments/linux-gnu-runtime/**'
      - 'scripts/check_gnu_link_map.py'
      - 'scripts/check_gnu_source_map.py'
      - 'scripts/check_gnu_notices.py'
      - 'scripts/test_gnu_notices.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/**'
      - 'vendor/**'
      - 'migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puffinbox-gnu-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Shared-runtime link inventory and numeric comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check runtime inventory and notice regressions
        run: python3 -m unittest discover -s scripts -p 'test_gnu_*.py'

      - name: Build disposable probe infrastructure
        run: docker build --tag puffinbox:gnu-probe-builder --file experiments/linux-gnu-runtime/Dockerfile .

      - name: Reproduce the experimental server and helper comparisons
        run: |
          mkdir "$RUNNER_TEMP/gnu-probe"
          docker run --rm --workdir /work \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$RUNNER_TEMP/gnu-probe:/probe" \
            puffinbox:gnu-probe-builder --output /probe/output --source-map

      - name: Inspect source locations with an external audit tool
        run: |
          printf '%s\n' 'pyelftools==0.33 --hash=sha256:f215ad5f47d3f1373a21496a6c9e0707c622840d0622f23ff7ce08678b020036' \
            | python3 -m pip install --only-binary=:all: --require-hashes \
                --target "$RUNNER_TEMP/gnu-inspector" --requirement /dev/stdin
          PYTHONPATH="$RUNNER_TEMP/gnu-inspector" python3 scripts/check_gnu_source_map.py \
            --binary "$RUNNER_TEMP/gnu-probe/output/server" \
            --source-hashes "$RUNNER_TEMP/gnu-probe/output/standard-library-source-hashes.json" \
            --output "$RUNNER_TEMP/source-line-inventory.json"

      - name: Classify exact mapped standard-library paths against compiler notices
        run: |
          python3 scripts/check_gnu_notices.py \
            --inventory "$RUNNER_TEMP/source-line-inventory.json" \
            --source-hashes "$RUNNER_TEMP/gnu-probe/output/standard-library-source-hashes.json" \
            --notice "$RUNNER_TEMP/gnu-probe/output/COPYRIGHT-library.html" \
            --output "$RUNNER_TEMP/compiler-notice-classification.json"

      - name: Save probe records without binaries or external runtime libraries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experimental-gnu-runtime-records
          path: |
            ${{ runner.temp }}/gnu-probe/output/probe.json
            ${{ runner.temp }}/gnu-probe/output/runtime-input-inventory.json
            ${{ runner.temp }}/gnu-probe/output/server-elf.txt
            ${{ runner.temp }}/gnu-probe/output/server-dynamic-symbols.txt
            ${{ runner.temp }}/gnu-probe/output/server-sections.txt
            ${{ runner.temp }}/gnu-probe/output/standard-library-source-hashes.json
            ${{ runner.temp }}/gnu-probe/output/COPYRIGHT-library.html
            ${{ runner.temp }}/source-line-inventory.json
            ${{ runner.temp }}/compiler-notice-classification.json
          if-no-files-found: warn
