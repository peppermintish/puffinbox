name: Continuous integration

on:
  push:
    branches: [main, implementation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puffinbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Linux source, license, and static build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: throttle_test
          POSTGRES_PASSWORD: throttle_test
          POSTGRES_DB: throttle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U throttle_test -d throttle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools binutils perl make

      - name: Select the locked release toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-linux-musl
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Check the experimental GNU process entry
        run: python3 scripts/check_gnu_runtime_entry.py

      - name: Check source formatting
        run: cargo fmt --all -- --check

      - name: Check Rust code
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets

      - name: Verify outbound TLS certificate checks
        run: |
          cargo build --locked --example tls_probe
          python3 scripts/check_tls.py --probe target/debug/examples/tls_probe

      - name: Run PostgreSQL login-throttle concurrency test
        env:
          PUFFINBOX_TEST_DATABASE_URL: postgres://throttle_test:throttle_test@127.0.0.1:5432/throttle_test
        run: cargo test --locked --test postgres_login_throttle -- --ignored --nocapture

      - name: Run isolated PostgreSQL regression targets
        env:
          PUFFINBOX_TEST_DATABASE_URL: postgres://throttle_test:throttle_test@127.0.0.1:5432/throttle_test
        run: |
          cargo test --locked --test postgres_policy_visibility -- --ignored --nocapture
          cargo test --locked --test postgres_server_guards -- --ignored --nocapture
          cargo test --locked --test postgres_session_capabilities -- --ignored --nocapture
          cargo test --locked --test postgres_websocket -- --ignored --nocapture
          cargo test --locked --test postgres_user_preferences -- --ignored --nocapture
          cargo test --locked --test postgres_catalog_navigation -- --ignored --nocapture
          cargo test --locked --test postgres_catalog_filters -- --ignored --nocapture
          cargo test --locked --test postgres_media_access_tokens -- --ignored --nocapture
          cargo test --locked --test postgres_metadata_schema -- --ignored --nocapture
          cargo test --locked --test postgres_offline_packages -- --ignored --nocapture
          cargo test --locked --test postgres_plugins -- --ignored --nocapture
          cargo test --locked --test postgres_playlists -- --ignored --nocapture
          cargo test --locked --test postgres_metadata_catalog -- --ignored --nocapture
          cargo test --locked --test postgres_dlna -- --ignored --nocapture
          cargo test --locked --test postgres_book_reader -- --ignored --nocapture
          cargo test --locked --test postgres_livetv -- --ignored --nocapture
          cargo test --locked --test postgres_livetv_dvr -- --ignored --nocapture
          cargo test --locked --lib media_features::livetv_recorder::tests::due_timer_claim_serializes_with_stale_channel_cleanup -- --ignored --exact --nocapture

      - name: Check browser and helper syntax
        run: |
          node --check web/client-compat.js
          node --check web/app.js
          node --check web/live-tv.js
          node --check web/book-reader.js
          node --check web/device-id.js
          node --check web/jmp-player.js
          node --check web/playback-heartbeat.js
          node --check web/offline-cache.js
          node --check web/offline-sw.js
          node --check scripts/test_offline_browser.js
          node --check scripts/test_livetv_browser.js
          node --check scripts/test_playlists_browser.js
          node scripts/test_client_compat.js
          node scripts/test_device_id.js
          node scripts/test_jmp_player.js
          node scripts/test_playback_heartbeat.js
          node scripts/test_offline_cache.js
          node --test web/book-reader.test.cjs
          python -m compileall -q scripts
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/acceptance.py --help >/dev/null

      - name: Check offline behavior in Chromium
        timeout-minutes: 5
        run: node scripts/test_offline_browser.js

      - name: Check Live TV behavior in Chromium
        timeout-minutes: 5
        env:
          PUFFINBOX_BROWSER_BODY_DELAY_MS: '60'
        run: node scripts/test_livetv_browser.js

      - name: Check playlists in Chromium
        timeout-minutes: 5
        run: node scripts/test_playlists_browser.js

      - name: Compare declared routes with the pinned public API schema
        run: python scripts/api_coverage.py --check --output "$RUNNER_TEMP/api-route-coverage.md"

      - name: Install dependency audit tools
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --features cli --version 0.9.2 cargo-about

      - name: Audit dependencies and generate full notices
        run: python scripts/build_license_bundle.py

      - name: Build the static Linux release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin puffinbox-server

      - name: Verify static Linux TLS certificate checks
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --example tls_probe
          python3 scripts/check_tls.py --probe target/x86_64-unknown-linux-musl/release/examples/tls_probe

      - name: Build the project-only container image
        run: docker build --tag puffinbox:ci --file Dockerfile .

      - name: Save route comparison report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-route-declaration-comparison
          path: ${{ runner.temp }}/api-route-coverage.md
          if-no-files-found: error

  isolated-acceptance:
    name: Isolated PostgreSQL and synthetic media acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install fixture generator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Create isolated synthetic media and credentials
        run: python scripts/prepare_acceptance.py

      - name: Add supplemental original synthetic fixtures
        run: python scripts/prepare_supplemental_fixtures.py

      - name: Build project-only image
        run: docker build --tag puffinbox:local --file Dockerfile .

      - name: Check HTTPS proxy and remote access policy
        timeout-minutes: 5
        run: |
          docker pull postgres:18.6-alpine
          docker pull python@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
          python3 scripts/check_remote_access.py --image puffinbox:local --tools-image python@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b --output-dir .local/remote-access

      - name: Build external test-tool image
        run: docker build --tag puffinbox:acceptance-tools --file Dockerfile.acceptance-ffmpeg .

      - name: Build isolated operator test image
        run: >-
          docker compose --project-name puffinbox-acceptance --env-file .local/acceptance/acceptance.env
          -f docker-compose.yml
          -f docker-compose.acceptance.yml
          -f docker-compose.ffmpeg-runtime.yml
          build server

      - name: Check operator FFmpeg and FFprobe inside the local runtime image
        run: python3 scripts/check_operator_runtime.py --image puffinbox:operator-ffmpeg

      - name: Start isolated services
        run: >-
          docker compose --project-name puffinbox-acceptance --env-file .local/acceptance/acceptance.env
          -f docker-compose.yml
          -f docker-compose.acceptance.yml
          -f docker-compose.ffmpeg-runtime.yml
          up -d --wait --wait-timeout 120

      - name: Run isolated semantic acceptance
        run: python scripts/acceptance.py --require-scan --require-transcode

      - name: Save local acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: isolated-acceptance-evidence
          path: |
            .local/acceptance/acceptance-results.json
            .local/remote-access/results.json
          if-no-files-found: warn

      - name: Stop isolated services and remove test volumes
        if: always()
        run: >-
          docker compose --project-name puffinbox-acceptance --env-file .local/acceptance/acceptance.env
          -f docker-compose.yml
          -f docker-compose.acceptance.yml
          -f docker-compose.ffmpeg-runtime.yml
          down --volumes --remove-orphans
