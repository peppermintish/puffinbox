services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a long random POSTGRES_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: puffinbox:local
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      PUFFINBOX_BIND: 0.0.0.0:8096
      PUFFINBOX_DATA_DIR: /data
      PUFFINBOX_WEB_ROOT: /app/web
      PUFFINBOX_SERVER_NAME: ${PUFFINBOX_SERVER_NAME:-Puffinbox}
      PUFFINBOX_PUBLIC_BASE_URL: ${PUFFINBOX_PUBLIC_BASE_URL:-}
      PUFFINBOX_DLNA_ENABLED: ${PUFFINBOX_DLNA_ENABLED:-false}
      PUFFINBOX_DLNA_INTERFACE_ADDRESS: ${PUFFINBOX_DLNA_INTERFACE_ADDRESS:-}
      PUFFINBOX_DLNA_ADVERTISED_ORIGIN: ${PUFFINBOX_DLNA_ADVERTISED_ORIGIN:-}
      PUFFINBOX_COOKIE_SECURE: ${PUFFINBOX_COOKIE_SECURE:-false}
      PUFFINBOX_TRUSTED_PROXIES: ${PUFFINBOX_TRUSTED_PROXIES:-}
      PUFFINBOX_LOCAL_NETWORKS: ${PUFFINBOX_LOCAL_NETWORKS:-}
      PUFFINBOX_CORS_ORIGINS: ${PUFFINBOX_CORS_ORIGINS:-}
      PUFFINBOX_BOOTSTRAP_ADMIN_USERNAME: ${PUFFINBOX_BOOTSTRAP_ADMIN_USERNAME:-}
      PUFFINBOX_BOOTSTRAP_ADMIN_PASSWORD: ${PUFFINBOX_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${PUFFINBOX_PORT:-127.0.0.1:8096}:8096"
    volumes:
      - puffinbox-data:/data
      - type: bind
        source: ${MEDIA_ROOT:-./media}
        target: /media
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 128
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  database-data:
  puffinbox-data:
